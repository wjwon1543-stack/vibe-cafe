<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <p class="cafe-logo" aria-hidden="true">☕</p>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <main>
    <nav class="tab-menu" role="tablist" aria-label="주문 메뉴">
      <button class="tab-button active" id="order-tab" type="button" role="tab" aria-selected="true" aria-controls="order-panel">
        ☕ 주문하기
      </button>
      <button class="tab-button" id="history-tab" type="button" role="tab" aria-selected="false" aria-controls="history-panel">
        📋 주문 내역 <span class="order-count" id="orders-count">0</span>
      </button>
    </nav>

    <section id="order-panel" role="tabpanel" aria-labelledby="order-tab">
      <form id="order-form" novalidate>
      <div>
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" required>
      </div>

      <div>
        <label for="phone">전화번호</label>
        <input type="tel" id="phone" name="phone">
      </div>

      <div>
        <label for="drink">음료 선택</label>
        <select id="drink" name="drink">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="cafe-latte" data-price="4000">카페라떼 4,000원</option>
          <option value="cafe-mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
          <option value="grapefruit-black-tea" data-price="5000">자몽블랙티 5,000원</option>
          <option value="grapefruit-smoothie" data-price="5500">자몽 스무디 5,500원</option>
          <option value="yuja-smoothie" data-price="5500">유자 스무디 5,500원</option>
        </select>
      </div>

      <fieldset>
        <legend>사이즈</legend>
        <div>
          <input type="radio" id="size-s" name="size" value="S" data-price="0">
          <label for="size-s">S +0원</label>
        </div>
        <div>
          <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
          <label for="size-m">M +500원</label>
        </div>
        <div>
          <input type="radio" id="size-l" name="size" value="L" data-price="1000">
          <label for="size-l">L +1,000원</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>추가 옵션</legend>
        <div>
          <input type="checkbox" id="extra-shot" name="extras" value="shot" data-price="500">
          <label for="extra-shot">샷 추가 +500원</label>
        </div>
        <div>
          <input type="checkbox" id="extra-cream" name="extras" value="cream" data-price="500">
          <label for="extra-cream">크림 추가 +500원</label>
        </div>
        <div>
          <input type="checkbox" id="extra-syrup" name="extras" value="syrup" data-price="300">
          <label for="extra-syrup">시럽 추가 +300원</label>
        </div>
        <div>
          <input type="checkbox" id="extra-decaf" name="extras" value="decaf" data-price="0">
          <label for="extra-decaf">디카페인 +0원</label>
        </div>
      </fieldset>

      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <div>
        <label for="request">요청사항</label>
        <textarea id="request" name="request"></textarea>
      </div>

      <!-- 예상 금액은 주문하기 버튼 바로 위에 표시합니다. -->
      <p id="estimated-price" aria-live="polite">예상 금액: 0원</p>
      <button type="submit">주문하기</button>
      <button type="reset">다시 작성</button>
      </form>

      <!-- 주문 확인 메시지는 JavaScript에서 표시합니다. -->
      <div id="order-confirmation" role="status" aria-live="polite" hidden></div>
    </section>

    <section id="history-panel" class="hidden" role="tabpanel" aria-labelledby="history-tab">
      <div id="orders-list" class="orders-list" aria-live="polite"></div>
      <div class="orders-summary">
        <p id="orders-total">총 주문 금액: 0원 (0건)</p>
        <button id="clear-orders" class="clear-orders-button" type="button">내역 모두 지우기</button>
      </div>
    </section>
  </main>
</body>
</html>
